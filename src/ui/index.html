<!DOCTYPE html>
<html>

<head>
    <title>NSUI Banner Fixer</title>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#EEE" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="windows-ui/windows-ui.min.css" />
    <link rel="stylesheet" href="windows-ui/winui-icons.min.css" />
    <link rel="stylesheet" href="windows-ui/config/app-config.css" />
    <link rel="stylesheet" href="windows-ui-overwrites.css" />
    <link rel="stylesheet" href="window-decorations.css" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div id="windowBarContainer" class="window-bar">
        <div id="windowBarLeftResizeContainer">
            <div id="windowBarLeftCornerResize" data-webview-resize="tl"></div>
            <div id="windowBarLeftResize" data-webview-resize="l"></div>
        </div>

        <div id="windowBarCenterContainer">
            <div id="windowBarCenterResizeContainer">
                <div id="windowBarCenterLeftResize" data-webview-resize="tl"></div>
                <div id="windowBarCenterTopResize" data-webview-resize="t"></div>
            </div>
            <div id="windowBarCenter" data-webview-drag></div>
        </div>

        <div id="colorButtonContainer" class="window-bar-button-container">
            <div id="colorButtonResize" class="window-bar-button-resize" data-webview-resize="t"></div>
            <div id="colorButton" class="window-bar-button"><i class="icons10-sun visible-darkmode"></i><i
                    class="icons10-moon visible-lightmode"></i></div>
        </div>

        <div id="minButtonContainer" class="window-bar-button-container">
            <div id="minButtonResize" class="window-bar-button-resize" data-webview-resize="t"></div>
            <div id="minButton" class="window-bar-button"><i class="icons10-minus"></i></div>
        </div>

        <div id="maxButtonContainer" class="window-bar-button-container">
            <div id="maxButtonResize" class="window-bar-button-resize" data-webview-resize="t"></div>
            <div id="maxButton" class="window-bar-button">
                <i class="qlementine-icons--windows-maximize-16"></i>
            </div>
        </div>

        <div id="closeButtonContainer" class="window-bar-button-container">
            <div id="closeButtonResizeTopContainer" class="window-bar-button-resize">
                <div id="closeButtonResizeTop" data-webview-resize="t"></div>
                <div id="closeButtonResizeTopCorner" data-webview-resize="tr">
                </div>
            </div>
            <div id="closeButtonContainer2">
                <div id="closeButton" class="window-bar-button"><i class="icons10-cross"></i></div>
                <div id="closeButtonResizeRightContainer">
                    <div id="closeButtonResizeRightCorner" data-webview-resize="tr">
                    </div>
                    <div id="closeButtonResizeRight" data-webview-resize="r">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="window">

        <div id="resizeBarLeft" class="resize-bar-ver">
            <div id="resizeLeft" class="resize-bar-ver-center" data-webview-resize="l">
            </div>
            <div id="resizeLeftBottom" class="resize-bar-ver-corner" data-webview-resize="bl">
            </div>
        </div>

        <div id="windowWorkspace">

            <div class="app-page-container has-padding">

                <div class="no-scroll">
                    <h2>NSUI Banner Fixer</h2>
                    <div>
                        <p>Fix .cia files that have been generated by New Super Ultimate Injector v28 with the 3D GBA
                            model so that they display their banner information on EU consoles.</p>
                    </div>

                    <div class="app-hr" id="hr1" style="display: none;"></div>
                </div>

                <div class="app-table-view-container" id="tableContainer" style="display: none;">
                    <table class="app-table-view" style="width: 100%;">
                        <thead>
                            <tr>
                                <th align="left" style="min-width: 150px;">Files</th>
                                <th align="right"></th>
                            </tr>
                        </thead>
                        <tbody id="filesTableBody">
                        </tbody>
                    </table>
                </div>

                <div class="no-scroll" style="margin-bottom: 20px;">
                    <div id="checkboxDiv" style="display: none;">
                        <label class="app-switch">
                            <input type="checkbox" id="checkboxReplace" />
                            <div class="app-switch-view"></div>
                            <span class="app-switch-label">Overwrite original .cia files</span>
                        </label>
                    </div>
                    <div class="app-hr" id="hr2"></div>

                    <div id="buttonsDiv">
                        <button class="app-btn app-btn-function app-btn-primary" id="addBtn" type="button">
                            <i class="icons10-plus"></i>
                            <span>Add .cia files</span>
                        </button>
                        <button class="app-btn app-btn-function" id="fixBtn" type="button" disabled>
                            <i class="icons10-fantasy"></i>
                            <span>Fix banners</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="resizeBarRight" class="resize-bar-ver">
            <div id="resizeRight" class="resize-bar-ver-center" data-webview-resize="r"></div>
            <div id="resizeRightBottom" class="resize-bar-ver-corner" data-webview-resize="br"></div>
        </div>
    </div>

    <div id="resizeBarBottom" class="resize-bar-hor resize-bar-hor-bottom">
        <div id="resizeBottomLeft" class="resize-bar-hor-corner" data-webview-resize="bl"></div>
        <div id="resizeBottom" class="resize-bar-hor-center" data-webview-resize="b"></div>
        <div id="resizeBottomRight" class="resize-bar-hor-corner" data-webview-resize="br"></div>
    </div>

    <div id="successBar" class="app-alert-bar alert-bar-success" role="alert">
        <i class="icons10-checkmark app-color-success"></i>
        <strong class="app-color-success">Success</strong><!--<span>This is a text</span>-->
        <div class="app-alert-bar-end-content">
            <button id="alertCloseButtonSuccess" aria-label="Close"></button>
        </div>
    </div>

    <div id="dangerBar" class="app-alert-bar alert-bar-danger" role="alert">
        <i class="icons10-cross app-color-danger"></i>
        <strong class="app-color-danger">Error</strong><span>This is a text</span>
        <div class="app-alert-bar-end-content">
            <button id="alertCloseButtonError" aria-label="Close"></button>
        </div>
    </div>

    <div class="app-alert app-dialog show" id="missingReqsAlert" tabindex="-1">
        <div class="app-alert-modal" aria-modal="true" role="dialog">
            <div class="app-alert-header">
                <h1 class="app-color-danger"><i class="icons10-exclamation-mark"></i>Error</h1>
                <div class="app-alert-message" id="missingReqsAlertText">error text</div>
            </div>
            <div class="app-alert-footer">
                <button class="app-btn" id="missingReqsAlertCloseBtn">
                    <span>OK</span>
                </button>
            </div>
        </div>
    </div>



</body>
<script type="text/javascript" src="windows-ui/windows-ui.min.js"></script>
<script type="text/javascript" src="window-decorations.js"></script>
<script type="text/javascript" src="script.js"></script>

</html>
