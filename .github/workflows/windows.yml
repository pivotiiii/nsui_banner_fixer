# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: Build and test on Windows.
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ${{matrix.os}}

    strategy:
      fail-fast: true
      matrix:
        ui: [ON, OFF]
        os: [windows-latest, ubuntu-24.04]
        c_compiler: [cl, gcc-14, clang-18]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-24.04
            c_compiler: gcc-14
            cpp_compiler: g++-14
          - os: ubuntu-24.04
            c_compiler: clang-18
            cpp_compiler: clang++-18
        exclude:
          - os: windows-latest
            c_compiler: gcc-14
          - os: windows-latest
            c_compiler: clang-18
          - os: ubuntu-24.04
            c_compiler: cl
          

    steps:
    - uses: actions/checkout@v4

    - name: 🗃 Cache
      uses: actions/cache@v4.0.2
      with:
        # A list of files, directories, and wildcard patterns to cache and restore
        path: |
          ${{github.workspace}}/build/_deps/*-src
          ${{github.workspace}}/build/node_modules
          ${{github.workspace}}/build/appimagetool-*-x86_64.AppImage
        # An explicit key for restoring and saving the cache
        key: ${{ runner.os }}-build-UI-${{matrix.ui}}-${{hashFiles('dependencies.cmake', 'patches/*.patch')}}
    
    # -----------------------    
    # ⚙ Setup
    # -----------------------
        
    - name: ⚙ Enable MSVC Developer Command Prompt
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1.13.0
      with: 
        arch: amd64
        toolset: 19.40

    - name: ⚙ Install apt dependencies
      if: matrix.os == 'ubuntu-24.04'
      run: |
        sudo apt-get update
        sudo apt-get -y install libadwaita-1-dev libwebkitgtk-6.0-dev


    # -----------------------    
    # CMake Configure and Build
    # -----------------------
        
    - name: 🛠 Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{github.workspace}}/build 
        -S ${{github.workspace}} 
        -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE 
        -DBUILD_GUI=${{matrix.ui}} 
        -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} 
        -DCMAKE_CXX_COMPILER=${{matrix.cpp_compiler}}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}

    - name: 🛠 Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target nsui_banner_fixer

    # - name: 🧪 Test
    #   working-directory: ${{github.workspace}}/build
    #   # Execute tests defined by the CMake configuration.
    #   # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
    #   run: ctest -C ${{env.BUILD_TYPE}}

    - name: 🤏 Pack
      working-directory: ${{github.workspace}}/build
      run: cpack -G ZIP -C ${{env.BUILD_TYPE}}

    # -----------------------    
    # Uploading Artifacts
    # -----------------------

    - name: ⬆ Upload a Build Artifact on Windows
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4.3.3
      with:
        name: nsui_banner_fixer_CPACK_${{env.BUILD_TYPE}}_${{matrix.os}}_${{matrix.c_compiler}}_UI_${{matrix.ui}}
        path: |
          ${{github.workspace}}/build/_CPack_Packages/win64/ZIP/*
          !${{github.workspace}}/build/_CPack_Packages/win64/ZIP/*.zip
        if-no-files-found: ignore

    - name: ⬆ Upload a Build Artifact on Ubuntu (pure executable)
      if: matrix.os == 'ubuntu-24.04'
      uses: actions/upload-artifact@v4.3.3
      with:
        name: nsui_banner_fixer_CPACK_${{env.BUILD_TYPE}}_${{matrix.os}}_${{matrix.c_compiler}}_UI_${{matrix.ui}}
        path: ${{github.workspace}}/build/_CPack_Packages/Linux/ZIP/*/application/*

    - name: ⬆ Upload a Build Artifact on Ubuntu (appimage)
      if: matrix.os == 'ubuntu-24.04'
      uses: actions/upload-artifact@v4.3.3
      with:
        name: nsui_banner_fixer_CPACK_${{env.BUILD_TYPE}}_${{matrix.os}}_${{matrix.c_compiler}}_UI_${{matrix.ui}}_APPIMAGE
        path: ${{github.workspace}}/build/_CPack_Packages/Linux/ZIP/*/appimage/*
